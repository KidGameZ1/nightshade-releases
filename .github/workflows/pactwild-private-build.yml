name: Private Pactwild native verification
on:
  workflow_dispatch:
    inputs:
      draft_tag:
        description: Unpublished draft containing frozen inputs
        required: true
        type: string
      input_sha256:
        description: Expected SHA-256 of inputs.zip
        required: true
        type: string
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72
        with:
          version: '26.0.3'
          build-type: release-msvc
          deployment-choice: '1'
      - name: Package and execute frozen game privately
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ inputs.draft_tag }}
          INPUT_SHA256: ${{ inputs.input_sha256 }}
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: 'true'
          WGL_DISABLE_ERROR_DIALOGS: '1'
          WGL_SWAP_INTERVAL: '0'
        run: python scripts/pactwild-private-build.py
