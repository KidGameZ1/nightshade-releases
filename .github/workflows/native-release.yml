name: Native release packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: '0.3.0'
      phase:
        type: choice
        options: [package, verify]
        default: package
        required: true
      input_sha256:
        description: SHA-256 of the compiled packaging inputs (package phase)
        required: false
permissions:
  contents: write # GitHub requires push access to read unpublished draft assets.
jobs:
  native:
    name: ${{ inputs.phase }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x64
          - runner: ubuntu-24.04
            platform: linux-x64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux' && inputs.phase == 'verify'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils libxi6 libxrandr2 libxinerama1 libxcursor1 libasound2t64
      - name: Install Windows software OpenGL for native verification
        if: runner.os == 'Windows' && inputs.phase == 'verify'
        # v3, pinned. Newer 26.2.7 MSVC builds currently document a software-GL regression.
        uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72
        with:
          version: '26.0.3'
          build-type: release-msvc
          deployment-choice: '1'
      - name: Build and verify native package
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          if [ '${{ inputs.phase }}' = verify ]; then
            xvfb-run -a -s '-screen 0 1440x900x24' python3 scripts/native-release.py '${{ inputs.phase }}' '${{ inputs.version }}' '${{ matrix.platform }}' '${{ inputs.input_sha256 }}'
          else
            python3 scripts/native-release.py '${{ inputs.phase }}' '${{ inputs.version }}' '${{ matrix.platform }}' '${{ inputs.input_sha256 }}'
          fi
      - name: Build and verify native package
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: 'true'
          WGL_DISABLE_ERROR_DIALOGS: '1'
          WGL_SWAP_INTERVAL: '0'
        run: python scripts/native-release.py '${{ inputs.phase }}' '${{ inputs.version }}' '${{ matrix.platform }}' '${{ inputs.input_sha256 }}'
      - name: Upload packages and verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Nightshade-${{ inputs.version }}-${{ matrix.platform }}-${{ inputs.phase }}
          path: |
            output/installers/
            output/evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
